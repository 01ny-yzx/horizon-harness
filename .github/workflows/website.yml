name: Website

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/website.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Install website dependencies
        run: npm ci --prefix frontend
      - name: Refresh public release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp
          --jq 'add | map(select(.draft == false and .prerelease == false)) |
          map({tag_name, html_url, published_at, body, assets: [.assets[] |
          {name, size, browser_download_url}]})'
          > frontend/public/releases.json
      - run: npm run build --prefix frontend
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
